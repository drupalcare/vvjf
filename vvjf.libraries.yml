  dependencies:
    - core/drupal
    - core/drupal.ajax
    - core/drupalSettings
    - core/once
    - vvj_core/tokens
    - vvj_core/base
    - vvj_core/a11y
    - vvj_core/element-base

vvjf-style:
  css:
    theme:
      css/vvjf-style.css: { }

vvjf__all:
  css:
    theme:
      css/vvjf-all.css: { }

vvjf__576:
