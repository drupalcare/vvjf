# Patterns. Each depends on vvjf/vvjf so its CSS loads after the module CSS,
# and the weights put it after the breakpoint files.
vvjf-pattern-base:
  css:
    theme:
      patterns/vvjf-pattern-base.css: { weight: 205 }
  dependencies:
    - vvjf/vvjf
    - vvj_patterns/base

pattern-turn:
  js:
    patterns/vvjf-turn.js: {}
  dependencies:
    - core/drupal

pattern.hand:
  css:
    theme:
      patterns/hand/vvjf-hand.css: { weight: 210 }
  js:
    patterns/hand/vvjf-hand.js: {}
  dependencies:
    - vvjf/vvjf-pattern-base
    - vvjf/pattern-turn
    - core/drupal
