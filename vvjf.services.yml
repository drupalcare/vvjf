services:
  Drupal\vvjf\Hook\VvjfHelpHook:
    autowire: true

  Drupal\vvjf\Hook\VvjfThemeHook:
    autowire: true

  Drupal\vvjf\Hook\VvjfPreprocessHooks:
    autowire: true

  # `@?` makes the dependency nullable so the container compiles even
  # when vvj_core hasn't been enabled yet (the v1 → v2 upgrade window
  # before vvjf_update_10001 runs).
  Drupal\vvjf\Hook\VvjfTokenHooks:
    arguments:
      - '@?vvj_core.token_resolver'
